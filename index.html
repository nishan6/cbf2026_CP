<style>
:root{color-scheme:dark;--bg:#000;--glass:rgba(22,22,24,.72);--glass2:rgba(40,40,44,.8);--ln:rgba(255,255,255,.1);--ln2:rgba(255,255,255,.18);--ink:#f5f5f7;--mut:#a1a1a6;--mut2:#6e6e73;--pgm:#ff453a;--pvw:#30d158;
--ui:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;--disp:"Bebas Neue","Oswald","Arial Narrow",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#000;color:var(--ink);font:14px/1.45 var(--ui);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:8px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}

.glass{background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);box-shadow:0 0 0 1px var(--ln)}

.brand{display:flex;align-items:center;gap:14px;min-width:0}

.pill:hover{background:var(--glass2)}
.pill.on{background:var(--ink);color:#000}
.pop{position:relative}

.pop.open .pop-b{display:block}
.lr{display:flex;align-items:center;gap:8px;padding:5px 2px}
.lr label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer}
.lr input{accent-color:#fff;width:15px;height:15px;margin:0}
.lr button{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--glass2)}
/* dock */

#dock .v{padding:9px 14px;border-radius:999px;color:var(--mut);white-space:nowrap;font-weight:500}
#dock .v:hover{color:var(--ink);background:var(--glass2)}
#dock .v[aria-pressed=true]{color:var(--ink);background:var(--glass2);box-shadow:inset 0 0 0 1px var(--ln2)}
#lab{position:fixed;inset:0;pointer-events:none;z-index:4}#lab span{position:absolute;transform:translate(-50%,-120%);font:600 11.5px/1 var(--ui);color:#fff;background:rgba(10,10,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,255,255,.16);padding:5px 9px;border-radius:999px;white-space:nowrap}#lab span i{font-style:normal;color:var(--mut);font-weight:500;margin-left:6px}#lab span.pgm{background:var(--pgm);box-shadow:none}body.cams #lab{display:none}
#imagSw{position:fixed;left:22px;top:84px;z-index:10;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:999px;font-size:12.5px;color:var(--mut)}
#imagSw .seg{margin:0;padding:2px}
#imagSw .seg button{padding:5px 12px;font-size:12.5px}
.hint{position:fixed;right:24px;top:92px;z-index:5;color:var(--mut2);font-size:12px;pointer-events:none}
/* cameras view */
#mv{position:fixed;inset:86px 22px 22px;z-index:8;display:none;flex-direction:column;gap:12px}
body.cams #mv{display:flex}

#pgm{flex:1;min-height:0;position:relative;border-radius:22px;box-shadow:0 0 0 2px var(--pgm),0 0 40px -10px var(--pgm)}

.tag b{font:400 22px/1 var(--disp);letter-spacing:.03em;transform:skewX(-9deg);display:inline-block}
.tag span{font-size:12px;color:#fff;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:999px}

#tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;flex:none}

  body.specs #dock{display:none}#specs h2{font-size:21px}.big{gap:18px}.big div b{font-size:20px}.kv{font-size:12.5px}
  #mv{top:calc(108px + env(safe-area-inset-top));left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));overflow:auto;gap:10px}

  #tiles{grid-template-columns:repeat(2,1fr);gap:8px}

@media (max-height:500px) and (orientation:landscape){

  header>.seg{order:0;width:auto;margin-left:auto}header>.seg button{flex:none;padding:6px 12px;font-size:13px}#lyBtn{padding:6px 12px;font-size:13px}
  .pop-b{position:absolute;left:auto;right:0;top:calc(100% + 8px);max-height:70vh}

  #dock{bottom:calc(8px + env(safe-area-inset-bottom))}#dock .v,#play{padding:7px 11px;font-size:12.5px}

  body.specs #dock{display:flex;left:calc((100% - min(380px,48vw)) / 2 - 10px);max-width:calc(52vw - 30px)}
  #mv{top:calc(54px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));bottom:8px;flex-direction:row;overflow:hidden}
  #pgm{flex:1;aspect-ratio:auto}#tiles{grid-template-columns:repeat(2,1fr);width:30%;overflow:auto;align-content:start}
  #lab span{font-size:10px}#lab span i{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  const fr = new T.LineSegments(new T.BufferGeometry().setAttribute("position", new T.BufferAttribute(new Float32Array(48), 3)), new T.LineBasicMaterial({ color: col, transparent: true, opacity: .7 })); fr.frustumCulled = false;
  [g, stand, ring, fr].forEach(o => LYR.cams.add(onL1(o)));
  const lb = document.createElement("span"); lb.innerHTML = `${esc(c.id)}<i>${esc(c.name)}</i>`; $("#lab").appendChild(lb);

const crn = [[-1, -1], [1, -1], [1, 1], [-1, 1]], v3 = new T.Vector3();

    const d = Math.min(Math.max(c.cam.position.distanceTo(tv), 6), 22), hh = Math.tan(c.cam.fov * Math.PI / 360) * d, hw = hh * 16 / 9, p = c.mk.fr.geometry.attributes.position;
    const V = crn.map(q => new T.Vector3(q[0] * hw, q[1] * hh, -d).applyMatrix4(c.cam.matrixWorld)); let k = 0; const put = v => p.setXYZ(k++, v.x, v.y, v.z);

  });
}
function placeLabels() {
  const show = LYR.cams.visible && mode !== "cams";
  CAMS.forEach((c, i) => { const l = c.mk.lb; if (!show) { l.style.display = "none"; return; } v3.copy(c.mk.g.position); v3.y += 1.1; v3.project(P); l.style.display = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1 ? "block" : "none"; l.style.left = (v3.x * .5 + .5) * W + "px"; l.style.top = (-v3.y * .5 + .5) * H + "px"; l.classList.toggle("pgm", i === pgm); });
}
function imagCam() { const c = CAMS[pgm]; aimCam(c, 2560 / 2816); // I-MAG is a cropped 16:9 picture: keep the vertical field
  return c.cam; }

/* ---------- view camera: orbit + tour ---------- */
const P = new T.PerspectiveCamera(42, 1, .3, 900); P.layers.enable(1);

function fromPosTgt(pos, tgt) { O.tgt.copy(tgt); const d = new T.Vector3().subVectors(pos, tgt); O.r = d.length(); O.ph = Math.acos(T.MathUtils.clamp(d.y / O.r, -1, 1)); O.th = Math.atan2(d.x, d.z); }

let fly = null, tour = null, viewIdx = -1;

function flyTo(v, dur = 2600) { fly = { a: P.position.clone(), at: O.tgt.clone(), b: new T.Vector3(...v.pos), bt: new T.Vector3(...v.tgt), t0: performance.now(), dur }; }

$("#play").onclick = () => tour ? stopTour() : startTour();
EV.views.forEach((v, i) => { const b = document.createElement("button"); b.className = "v"; b.textContent = v.name; b.setAttribute("aria-pressed", "false"); b.onclick = () => goView(i); $("#dock").appendChild(b); });
fromPosTgt(new T.Vector3(...EV.views[1].pos), new T.Vector3(...EV.views[1].tgt));

const ptr = new Map(); let pd = 0;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); if (ptr.size === 2) { const a = [...ptr.values()]; pd = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); } stopTour(); if (fly) { fly = null; fromPosTgt(P.position, O.tgt); } cv.classList.add("drag"); });
cv.addEventListener("pointermove", e => {
  const q = ptr.get(e.pointerId); if (!q) return; const dx = e.clientX - q[0], dy = e.clientY - q[1]; q[0] = e.clientX; q[1] = e.clientY;
  if (ptr.size === 2) { const a = [...ptr.values()], d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); O.r = T.MathUtils.clamp(O.r * pd / d, 3, 260); pd = d;
    const k = O.r * .0011 / 2, right = new T.Vector3().setFromMatrixColumn(P.matrix, 0); O.tgt.addScaledVector(right, -dx * k).y = T.MathUtils.clamp(O.tgt.y + dy * k, 0, 30); return; }
  if (e.shiftKey || e.buttons === 2) { const k = O.r * .0016, right = new T.Vector3().setFromMatrixColumn(P.matrix, 0), up = new T.Vector3(0, 1, 0); O.tgt.addScaledVector(right, -dx * k).addScaledVector(up, dy * k); return; }
  O.th -= dx * .005; O.ph = T.MathUtils.clamp(O.ph - dy * .005, .12, 1.62);
  $$("#dock .v").forEach(b => b.setAttribute("aria-pressed", "false"));
});
const up = e => { ptr.delete(e.pointerId); if (!ptr.size) cv.classList.remove("drag"); };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up); cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("wheel", e => { e.preventDefault(); stopTour(); if (fly) { fly = null; fromPosTgt(P.position, O.tgt); } O.r = T.MathUtils.clamp(O.r * (1 + e.deltaY * .001), 3, 260); }, { passive: false });

/* ---------- layers ---------- */
function lyr() { $("#lyList").innerHTML = Object.keys(LN).map(k => `<div class="lr"><label><input type="checkbox" data-l="${k}"${LYR[k].visible ? " checked" : ""}> ${LN[k]}</label><button data-o="${k}">Only</button></div>`).join("") + '<div class="lr"><button data-o="all">Show all</button></div>'; }
let iso = null;
function only(k) { iso = k === "all" ? null : k; for (const x in LYR) LYR[x].visible = !iso || x === k || x === "stage"; lyr(); syncSpecBtns(); }
$("#lyList").onclick = e => { const o = e.target.dataset.o, l = e.target.dataset.l; if (o) only(o); else if (l) { LYR[l].visible = e.target.checked; iso = null; syncSpecBtns(); } };
$("#lyBtn").onclick = e => { e.stopPropagation(); $("#lyPop").classList.toggle("open"); };
document.addEventListener("click", e => { if (!e.target.closest("#lyPop")) $("#lyPop").classList.remove("open"); });
lyr();

/* ---------- specs ---------- */
const inv = VEN.inventory || [], sum = f => inv.filter(f).reduce((s, x) => s + x.qty, 0);
const isSfx = x => /^SFX/.test(x.layer) || x.layer === "L Laser", isLight = x => !isSfx(x);
const ledArea = EV.led.surfaces.reduce((s, x) => s + x.area, 0), ledPx = EV.led.surfaces.reduce((s, x) => s + x.px[0] * x.px[1], 0);
const rows = list => `<dl class="kv">${list.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl>`;
const group = f => { const m = {}; inv.filter(f).forEach(x => m[x.name] = (m[x.name] || 0) + x.qty); return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([n, q]) => [n, q + "×"]); };
$("#specs").innerHTML = `<h2>${esc(EV.title)}</h2><p class="sub">${esc(EV.presentedBy || "")} · Production Specification</p>
  <div class="sp"><div class="sp-h"><h3>Stage</h3><button data-o="stage">Show</button></div>${rows(EV.specs.stage)}</div>
  <div class="sp"><div class="sp-h"><h3>LED screens</h3><button data-o="led">Show</button></div>
    <div class="big"><div><b>${Math.round(ledArea)} m²</b><span>${esc(EV.led.pitch)} LED</span></div><div><b>${(ledPx / 1e6).toFixed(1)} MP</b><span>total pixels</span></div><div><b>${EV.led.surfaces.length}</b><span>surfaces</span></div></div>
    ${rows(EV.led.surfaces.map(s => [s.name, `${s.px[0]} × ${s.px[1]} · ${s.m}`]))}</div>
  <div class="sp"><div class="sp-h"><h3>Lighting</h3><button data-o="light">Show</button></div><div class="big"><div><b>${sum(isLight)}</b><span>fixtures</span></div></div>${rows(group(isLight))}</div>
  <div class="sp"><div class="sp-h"><h3>Audio</h3><button data-o="pa">Show</button></div>${rows(EV.specs.audio)}</div>
  <div class="sp"><div class="sp-h"><h3>Special effects</h3><button data-o="sfx">Show</button></div><div class="big"><div><b>${sum(isSfx)}</b><span>units</span></div></div>${rows(group(isSfx))}</div>
  <div class="sp"><div class="sp-h"><h3>Cameras</h3><button data-cams>View</button></div><div class="big"><div><b>${CAMS.length}</b><span>camera sources</span></div></div>${rows(CAMS.map(c => [c.id + " · " + c.name, c.lens]))}<p class="sub" style="margin-top:10px">${esc(EV.switching || "")}</p></div>`;
function syncSpecBtns() { $$("#specs [data-o]").forEach(b => { const on = iso === b.dataset.o; b.classList.toggle("on", on); b.textContent = on ? "Show all" : "Show"; }); }

/* ---------- camera views ---------- */
$("#tiles").innerHTML = CAMS.map((c, i) => `<button class="tile" data-i="${i}" aria-label="Cut to ${esc(c.id)}"><span class="tag"><b>${esc(c.id)}</b></span><small>${esc(c.name)}</small></button>`).join("");

$$("header .seg button").forEach(b => b.onclick = () => setMode(b.dataset.m));
$$("#imagSw button").forEach(b => b.onclick = () => setImag(b.dataset.i));
setImag("live");

/* ---------- loop ---------- */
let W = 1, H = 1;

    surfMats.SR.mesh.visible = surfMats.SL.mesh.visible = true; }
